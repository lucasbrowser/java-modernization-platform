services:
  postgres:
    image: postgres:16-alpine
    container_name: modernization-postgres
    environment:
      POSTGRES_DB: order_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: modernization-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_platform
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-me-in-production-change-me-in-production-32chars
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
