
services:
  postgres:
    image: postgres:16-alpine
    container_name: modernization-postgres
    environment:
      POSTGRES_DB: order_platform
      POSTGRES_USER: ${DB_PROVISIONER_USERNAME:?Configure DB_PROVISIONER_USERNAME}
      POSTGRES_PASSWORD: ${DB_PROVISIONER_PASSWORD:?Configure DB_PROVISIONER_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Configure MIGRATION_DB_PASSWORD}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Configure RUNTIME_DB_PASSWORD}
      BOOTSTRAP_DB_PASSWORD: ${BOOTSTRAP_DB_PASSWORD:?Configure BOOTSTRAP_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/provision-postgres-roles.sql:/docker-entrypoint-initdb.d/10-provision-app-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d order_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  api:
    build: .
    container_name: modernization-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_platform
      DB_USERNAME: ${RUNTIME_DB_USERNAME:?Configure RUNTIME_DB_USERNAME}
      DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Configure RUNTIME_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      PROMETHEUS_USERNAME: ${PROMETHEUS_USERNAME:-prometheus}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD:?Configure PROMETHEUS_PASSWORD no arquivo .env}
      MANAGEMENT_SERVER_PORT: 8081
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app
      - monitoring
    restart: unless-stopped

  migrate:
    build: .
    container_name: modernization-migrate
    command: ["--migrate-only"]
    environment:
      MIGRATION_DB_URL: jdbc:postgresql://postgres:5432/order_platform
      MIGRATION_DB_USERNAME: ${MIGRATION_DB_USERNAME:?Configure MIGRATION_DB_USERNAME}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Configure MIGRATION_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: modernization-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.generated.yml:/etc/prometheus/prometheus.yml:ro
      - ./.secrets/prometheus_password:/etc/prometheus/prometheus_password:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: modernization-grafana
    environment:
      PROMETHEUS_USERNAME: ${PROMETHEUS_USERNAME:-prometheus}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD:?Configure PROMETHEUS_PASSWORD no arquivo .env}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Configure GRAFANA_ADMIN_PASSWORD no arquivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  app:
    driver: bridge
  monitoring:
    driver: bridge
